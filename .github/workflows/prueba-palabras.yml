# Prueba de palabras sueltas (03/11/2026): las mismas palabras con varios ajustes de Piper, para elegir de oído.
# Se corre a mano: Actions → «Prueba de palabras» → Run workflow (unos 5 minutos).
# Se escucha en https://manum876.github.io/Abece_voces/prueba-palabras/
name: Prueba de palabras
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voces
  cancel-in-progress: false
jobs:
  prueba:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            herramientas
            prueba-palabras
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Instalar lo necesario
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy omegaconf piper-tts==1.2.0
      - name: Generar las muestras
        run: python herramientas/prueba-palabras.py
      - name: Guardar en el repo
        run: |
          git config user.name "Abecé (voces)"
          git config user.email "azbuka.aprenderuso@gmail.com"
          git add -A prueba-palabras
          git diff --cached --quiet && echo "No hay cambios" || git commit -q -m "Prueba de palabras"
          git push
