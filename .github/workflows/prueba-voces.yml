# Prueba de voces en español para Abecé (21/10/2026): genera las mismas frases con cada voz candidata
# y las publica en prueba/ para escucharlas desde el teléfono (GitHub Pages).
# Se corre a mano: Actions → «Prueba de voces» → Run workflow. Tarda unos 10 minutos.
name: Prueba de voces
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Instalar lo necesario
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy omegaconf piper-tts==1.2.0
      - name: Generar las muestras
        run: python herramientas/prueba-voces.py
      - name: Guardar en el repo
        run: |
          touch .nojekyll
          git config user.name "Abecé (voces)"
          git config user.email "azbuka.aprenderuso@gmail.com"
          git add -A prueba .nojekyll
          git diff --cached --quiet && echo "No hay cambios" || git commit -q -m "Prueba de voces"
          git push
